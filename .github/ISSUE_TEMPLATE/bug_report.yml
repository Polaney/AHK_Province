name: 🐛 Сообщить об ошибке (Bug Report)
description: Сообщите о сбое, зависании, неработающей клавише или ошибке в отыгровке биндера
title: "[Баг]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🚨 Сообщение о найденной ошибке
        Спасибо за вклад в улучшение АХК УГИБДД NextGen! Пожалуйста, заполните форму ниже максимально подробно.

  - type: input
    id: version
    attributes:
      label: Версия скрипта / бинарника
      description: Какую версию вы используете?
      placeholder: "Например: v2.1.0 (или скомпилированный .exe)"
    validations:
      required: true

  - type: dropdown
    id: city
    attributes:
      label: Подразделение и сервер
      description: В каком управлении вы служите и на каком сервере Province играете?
      options:
        - УГИБДД-Н (г. Невский)
        - УГИБДД-П (г. Приволжск)
        - УГИБДД-М (г. Мирный)
        - 1 Сервер
        - 2 Сервер
        - 3 Сервер
        - 4 Сервер
        - 5 Сервер
        - 6 Сервер
        - 7 Сервер
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Что именно пошло не так? Какая функция сработала некорректно?
      placeholder: "Например: при нажатии Ctrl+Space мегафон отправляется, но в чате открывается инвентарь..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Опишите по шагам, как повторить эту ошибку.
      value: |
        1. Запустить 'АХК УГИБДД.exe' от имени Администратора
        2. Зайти в игру и нажать клавишу '...'
        3. Наблюдать ошибку '...'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи или текст ошибки Windows / AHK
      description: Если выскочило окно ошибки или есть строки из console.log, вставьте их сюда.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Предварительная проверка
      options:
        - label: Скрипт запущен от имени Администратора
          required: true
        - label: В настройках управления игры клавиша чата назначена на F6
          required: true
        - label: Я проверил, что этой ошибки нет в списке уже открытых Issues
          required: true
